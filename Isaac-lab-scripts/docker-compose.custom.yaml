services:
  isaac-lab-base:
    build:
      context: $ISAAC_SCRIPTS_DIR/..
      dockerfile: $ISAAC_SCRIPTS_DIR/Dockerfile
      args:
        - SIM_REPO_PATH=./gen3_isaac_env
      
    volumes:
      - type: bind
        source: $ISAAC_SCRIPTS_DIR/
        target: ${DOCKER_ISAACLAB_PATH}/Isaac-lab-scripts
      # The Dockerfile copies gen3_isaac_env to ../sim_to_real (relative to the Isaac Lab dir) at BUILD time and
      # pip-installs it editable from there. Without this mount, every change to the env config needs a
      # `container.py build`; with it, the host copy shadows the baked-in one and edits take effect on the next
      # `container.py start`. The target must be the same path the editable install points at.
      - type: bind
        source: $ISAAC_SCRIPTS_DIR/../gen3_isaac_env
        target: ${DOCKER_ISAACLAB_PATH}/../sim_to_real

